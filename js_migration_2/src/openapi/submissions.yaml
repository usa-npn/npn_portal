
# src/openapi/submissions.yaml
openapi: 3.1.0
info:
  title: submissions API
  version: 1.0.0
paths:
  /submissions:
    get:
      summary: Get all submissions
      responses:
        '200':
          description: A list of submissions
    post:
      summary: Create new submissions
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
      responses:
        '201':
          description: Created
  /submissions/{id}:
    get:
      summary: Get submissions by ID
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
      responses:
        '200':
          description: A submissions
    put:
      summary: Update submissions
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
      responses:
        '200':
          description: Updated
    delete:
      summary: Delete submissions
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
      responses:
        '204':
          description: Deleted
