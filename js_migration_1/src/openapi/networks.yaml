
# src/openapi/networks.yaml
openapi: 3.1.0
info:
  title: networks API
  version: 1.0.0
paths:
  /networks:
    get:
      summary: Get all networks
      responses:
        '200':
          description: A list of networks
    post:
      summary: Create new networks
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
      responses:
        '201':
          description: Created
  /networks/{id}:
    get:
      summary: Get networks by ID
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
      responses:
        '200':
          description: A networks
    put:
      summary: Update networks
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
      responses:
        '200':
          description: Updated
    delete:
      summary: Delete networks
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
      responses:
        '204':
          description: Deleted
