
# src/openapi/large.yaml
openapi: 3.1.0
info:
  title: large API
  version: 1.0.0
paths:
  /large:
    get:
      summary: Get all large
      responses:
        '200':
          description: A list of large
    post:
      summary: Create new large
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
      responses:
        '201':
          description: Created
  /large/{id}:
    get:
      summary: Get large by ID
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
      responses:
        '200':
          description: A large
    put:
      summary: Update large
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
      responses:
        '200':
          description: Updated
    delete:
      summary: Delete large
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
      responses:
        '204':
          description: Deleted
