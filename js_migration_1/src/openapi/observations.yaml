
# src/openapi/observations.yaml
openapi: 3.1.0
info:
  title: observations API
  version: 1.0.0
paths:
  /observations:
    get:
      summary: Get all observations
      responses:
        '200':
          description: A list of observations
    post:
      summary: Create new observations
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
      responses:
        '201':
          description: Created
  /observations/{id}:
    get:
      summary: Get observations by ID
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
      responses:
        '200':
          description: A observations
    put:
      summary: Update observations
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
      responses:
        '200':
          description: Updated
    delete:
      summary: Delete observations
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
      responses:
        '204':
          description: Deleted
