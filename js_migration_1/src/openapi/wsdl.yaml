
# src/openapi/wsdl.yaml
openapi: 3.1.0
info:
  title: wsdl API
  version: 1.0.0
paths:
  /wsdl:
    get:
      summary: Get all wsdl
      responses:
        '200':
          description: A list of wsdl
    post:
      summary: Create new wsdl
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
      responses:
        '201':
          description: Created
  /wsdl/{id}:
    get:
      summary: Get wsdl by ID
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
      responses:
        '200':
          description: A wsdl
    put:
      summary: Update wsdl
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
      responses:
        '200':
          description: Updated
    delete:
      summary: Delete wsdl
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
      responses:
        '204':
          description: Deleted
