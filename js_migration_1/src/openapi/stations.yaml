
# src/openapi/stations.yaml
openapi: 3.1.0
info:
  title: stations API
  version: 1.0.0
paths:
  /stations:
    get:
      summary: Get all stations
      responses:
        '200':
          description: A list of stations
    post:
      summary: Create new stations
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
      responses:
        '201':
          description: Created
  /stations/{id}:
    get:
      summary: Get stations by ID
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
      responses:
        '200':
          description: A stations
    put:
      summary: Update stations
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
      responses:
        '200':
          description: Updated
    delete:
      summary: Delete stations
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
      responses:
        '204':
          description: Deleted
